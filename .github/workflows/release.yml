name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        # `npm ci` pins to package-lock.json; a floating `npm install` pulls a
        # newer @tauri-apps/api than the Cargo.lock tauri crate and the build
        # aborts on the version-mismatch check.
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Markdown Viewer ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri's CLI unconditionally appends libwebkit2gtk-4.1-0 / libgtk-3-0 to
      # the deb Depends field on Linux, ignoring bundle.linux.deb.depends. To let
      # the package install on systems without those libs, rewrite the control
      # file in place and re-sign the archive.
      - name: Demote deb hard dependencies to Recommends
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::No .deb produced"; exit 1
          fi
          for deb in "${debs[@]}"; do
            echo "== rewriting $deb =="
            work=$(mktemp -d)
            dpkg-deb -R "$deb" "$work/pkg"

            ctrl="$work/pkg/DEBIAN/control"
            # Move the two webkit/gtk runtime libs out of Depends into Recommends,
            # keeping whatever else is in Depends.
            depends=$(grep -oP '^Depends:\s*\K.*' "$ctrl" || true)
            kept=$(printf '%s' "$depends" \
              | tr ',' '\n' | sed 's/^ *//;s/ *$//' \
              | grep -v -E '^(libwebkit2gtk-4\.1-0|libgtk-3-0)$' \
              | paste -sd ',' - | sed 's/,/, /g' || true)
            recommends="libwebkit2gtk-4.1-0, libgtk-3-0"

            if [ -n "$kept" ]; then
              sed -i "s|^Depends:.*|Depends: $kept|" "$ctrl"
            else
              sed -i '/^Depends:/d' "$ctrl"
            fi

            # Merge into an existing Recommends without duplicating entries
            # (tauri.conf.json may already list these two).
            if grep -q '^Recommends:' "$ctrl"; then
              existing=$(grep -oP '^Recommends:\s*\K.*' "$ctrl")
              merged=$(printf '%s,%s' "$existing" "$recommends" \
                | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' \
                | awk '!seen[$0]++' | paste -sd ',' - | sed 's/,/, /g')
              sed -i "s|^Recommends:.*|Recommends: $merged|" "$ctrl"
            else
              sed -i "/^Depends:/a Recommends: $recommends" "$ctrl"
              grep -q '^Recommends:' "$ctrl" || echo "Recommends: $recommends" >> "$ctrl"
            fi

            echo "---- new control ----"
            cat "$ctrl"

            dpkg-deb -b "$work/pkg" "$deb" >/dev/null
            rm -rf "$work"
          done

      - name: Verify deb dependencies
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            echo "== $deb =="
            dpkg-deb -f "$deb" Depends
            if dpkg-deb -f "$deb" Depends | grep -q 'libwebkit2gtk-4.1-0'; then
              echo "::error::libwebkit2gtk-4.1-0 is still a hard dependency"; exit 1
            fi
          done

      # The release step above already uploaded the original .deb; replace it
      # with the rewritten one so users download the dependency-free version.
      - name: Re-upload rewritten deb
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            gh release upload "$GITHUB_REF_NAME" "$deb" --clobber
          done

      - name: Upload portable Windows exe
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # A branch ref like feat/android-arm64 contains a slash, which would be
          # read as a directory here; sanitize it so manual runs don't break.
          VER="${VER//\//-}"
          OUT="Markdown.Viewer_${VER}_x64_portable.exe"
          cp "src-tauri/target/release/md-viewer.exe" "$OUT"
          gh release upload "$GITHUB_REF_NAME" "$OUT" --clobber

  # Android: the runner image ships a matching SDK + NDK, so no manual setup.
  publish-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Tauri v2 looks for NDK 29.0.13846066 / android-37 specifically; it can
      # install them itself, but only once the base SDK + licenses exist. The
      # deprecated "tools" package makes setup-android's default list fail, so
      # ask for an explicit minimal set.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools cmdline-tools;latest
          accept-android-sdk-licenses: true

      - name: Show Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        # `npm ci` pins to package-lock.json; a floating `npm install` pulls a
        # newer @tauri-apps/api than the Cargo.lock tauri crate and the build
        # aborts on the version-mismatch check.
        run: npm ci

      # Generates src-tauri/gen/android/ on first run.
      - name: Initialize Android project
        run: npx tauri android init --ci

      # arm64 only: that's the 64-bit ABI almost every current phone uses.
      - name: Build Android APK
        run: npx tauri android build --apk --target aarch64

      # The release build emits an *unsigned* APK. Sign it with a locally
      # generated debug keystore so the artifact installs on a phone for testing.
      # A real release keystore (base64 in ANDROID_KEYSTORE_BASE64, plus
      # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS) is used when configured,
      # so the same workflow covers a store-ready build later.
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APKSIGNER="$BT/apksigner"
          echo "using $APKSIGNER"

          WORK=$(mktemp -d)
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "== using provided release keystore =="
            echo "$KEYSTORE_B64" | base64 -d > "$WORK/release.keystore"
            KS="$WORK/release.keystore"
            KSPASS="${KEYSTORE_PASS:?keystore password secret missing}"
            ALIAS="${KEY_ALIAS:?key alias secret missing}"
            OUTSUFFIX="arm64"
          else
            echo "== generating debug keystore =="
            KS="$WORK/debug.keystore"
            KSPASS="android"
            ALIAS="androiddebugkey"
            OUTSUFFIX="arm64-debug"
            keytool -genkeypair -v               -keystore "$KS" -storepass "$KSPASS" -keypass "$KSPASS"               -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

          shopt -s nullglob
          found=0
          for f in $(find src-tauri/gen/android -name "*.apk" -type f); do
            found=1
            base=$(basename "$f" .apk)
            dst="out/MarkdownViewer-${OUTSUFFIX}-${base%-unsigned}.apk"
            echo "signing $f -> $dst"
            "$APKSIGNER" sign               --ks "$KS" --ks-pass "pass:$KSPASS" --key-pass "pass:$KSPASS"               --ks-key-alias "$ALIAS"               --out "$dst" "$f"
            "$APKSIGNER" verify --print-certs "$dst" | head -5
          done
          [ "$found" = 1 ] || { echo "::error::no APK found to sign"; exit 1; }
          ls -la out/
          rm -rf "$WORK"

      - name: Upload APKs to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(out/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APK produced"; exit 1
          fi
          for apk in "${apks[@]}"; do
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          done

      # Always keep the APK as a workflow artifact, even on branch builds.
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error
