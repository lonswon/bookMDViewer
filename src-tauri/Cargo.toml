[package]
name = "md-viewer"
version = "1.2.1"
description = "A lightweight local Markdown viewer"
authors = ["craig"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows quirk).
name = "md_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `notify` uses inotify/FSEvents/ReadDirectoryChangesW, none of which exist for
# Android's SAF `content://` documents - so it is desktop-only.
[target.'cfg(not(target_os = "android"))'.dependencies]
notify = "6"

# SAF-backed file access for scoped storage on Android 10+.
# `protocol_content` registers the `android-fs-content:` custom protocol so
# images referenced by a content:// URI can render inside the webview.
[target.'cfg(target_os = "android")'.dependencies]
# `legacy_storage_permission` declares READ/WRITE_EXTERNAL_STORAGE in the merged
# manifest for Android <= 9, where SAF is not enough on its own. Android 10+
# needs no storage permission for SAF-picked documents; the request just
# succeeds immediately, which keeps one code path across versions.
tauri-plugin-android-fs = { version = "=29.0.0", features = [
  "protocol_content",
  "legacy_storage_permission",
] }

# Smallest possible release binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
